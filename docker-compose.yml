services:
  # ────────────────────────────────────────────────────────────────────────────
  # Development shell
  # Run: docker compose run --rm dev
  # ────────────────────────────────────────────────────────────────────────────
  dev:
    image: ldwatch:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ldwatch-dev
    working_dir: /ld-watch
    volumes:
      - .:/ld-watch
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    stdin_open: true
    tty: true
    command: /bin/bash
  # ────────────────────────────────────────────────────────────────────────────
  # Attack scenario testing
  # Run: docker compose run --rm attack-test
  # ────────────────────────────────────────────────────────────────────────────
  attack-test:
    image: ldwatch:dev
    working_dir: /ld-watch
    volumes:
      - .:/ld-watch
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    stdin_open: true
    tty: true
    command: bash scripts/run_tests.sh
  # ────────────────────────────────────────────────────────────────────────────
  # CI simulation
  # Run: docker compose run --rm ci
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    image: ldwatch:dev
    working_dir: /ld-watch
    volumes:
      - .:/ld-watch
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    command: bash -c "make && go test ./... -v"
