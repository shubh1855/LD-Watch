services:
  # ────────────────────────────────────────────────────────────────────────────
  # Development shell
  # Run: docker compose run --rm dev
  # ────────────────────────────────────────────────────────────────────────────
  dev:
    image: ldwatch:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ldwatch-dev
    working_dir: /ld-watch
    volumes:
      - .:/src:ro
    tmpfs:
      - /ld-watch
    stdin_open: true
    tty: true
    command: ["/bin/bash", "-lc", "cp -a /src/. /ld-watch/ && exec /bin/bash"]
  # ────────────────────────────────────────────────────────────────────────────
  # Attack scenario testing
  # Run: docker compose run --rm attack-test
  # ────────────────────────────────────────────────────────────────────────────
  attack-test:
    image: ldwatch:dev
    working_dir: /ld-watch
    volumes:
      - .:/src:ro
    tmpfs:
      - /ld-watch
    stdin_open: true
    tty: true
    command: ["/bin/bash", "-lc", "cp -a /src/. /ld-watch/ && exec bash scripts/run_tests.sh"]
  # ────────────────────────────────────────────────────────────────────────────
  # CI simulation
  # Run: docker compose run --rm ci
  # ────────────────────────────────────────────────────────────────────────────
  ci:
    image: ldwatch:dev
    working_dir: /ld-watch
    volumes:
      - .:/src:ro
    tmpfs:
      - /ld-watch
    command: ["/bin/bash", "-lc", "cp -a /src/. /ld-watch/ && exec bash -c 'make && go test ./... -v'"]
