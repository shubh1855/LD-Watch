name: LD-Watch CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check system dependencies
        run: |
          gcc --version
          make --version
          curl --version
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build audit library, collector, and CLI
        run: make all
      - name: Verify build artifacts
        run: |
          test -f audit/audit.so
          test -x bin/collector
          test -x bin/ldwatch-cli
      - name: Run Go race tests
        run: go test -race ./...
      - name: Run Go vet
        run: go vet ./...
      - name: Run C audit fixture suite
        run: bash scripts/test_audit.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldwatch-binaries
          path: |
            bin/
            audit/audit.so
