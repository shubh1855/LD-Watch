name: LD-Watch CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libsqlite3-dev sqlite3 strace
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Build project
        run: make
      - name: Run Go unit tests
        run: go test ./... -v
      # - name: Run integration tests
      #   run: |
      #     sudo mkdir -p /var/ldwatch
      #     sudo mkdir -p /run
      #     sudo chown runner:runner /var/ldwatch
      #     bash scripts/run_tests.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ldwatch-binaries
          path: |
            bin/
            audit/audit.so
